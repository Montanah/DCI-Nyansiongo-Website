name: Static site security checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: Check JavaScript syntax
        run: |
          node --check js/script.js
          node --check js/analytics.js
          node --check js/contact.mjs
          node --check js/contact-validation.mjs
      - name: Check security policies and contact validation
        run: |
          node scripts/security-policy.mjs --check
          node --test tests/security.test.mjs
