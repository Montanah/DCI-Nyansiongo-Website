name: Static site security checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - name: Check JavaScript syntax
        run: |
          node --check js/script.js
          node --check js/analytics.js
          node --check js/contact.mjs
          node --check js/contact-validation.mjs
      - name: Check security policies and contact validation
        run: |
          node scripts/security-policy.mjs --check
          node --test tests/security.test.mjs
